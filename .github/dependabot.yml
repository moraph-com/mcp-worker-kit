version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # @types/node follows the oldest Node version in "engines": a newer major would type-check code that calls APIs
    # those versions don't have. Raise it by hand when the supported range moves.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is held until typescript-eslint supports it (8.x peer range is <6.1.0). Lift this when it does.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
